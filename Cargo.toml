[package]
name = "stremio-nzb-addon"
version = "0.0.4"
edition = "2021"
publish = false

[[bin]]
name = "stremio-nzb-addon"
path = "src-rust/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
moka = { version = "0.12", features = ["future"] }
regex = "1"
once_cell = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
urlencoding = "2"
toml = "0.8"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
torrent-name-parser = "0.12"
nzb-rs = "0.6"
nzb-nntp = "0.2"
nzb-decode = "0.1"
nzb-dispatch = "0.2"
nzbdav-rar = "0.4"
dashmap = "6"
tower_governor = "0.8"
async-stream = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
hex = "0.4"
futures = "0.3"
rustix = { version = "0.38", features = ["fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
